      content="Interactive KSP Delta-V map and calculator for Kerbal Space Program. Plan rocket Delta-V for interplanetary missions across Kerbol and Outer Planets Mod."

    />

      content="https://ksp.loicviennois.com/favicon.512.png"

    <link href="/favicon.64.png" rel="icon" type="image/png" sizes="64x64" />
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" />
    <meta content="#14111c" name="theme-color" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "KSP Delta-V Planner",
        "alternateName": ["KSP Delta-V Calculator", "KSP Delta-V Map"],
        "url": "https://ksp.loicviennois.com/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "isAccessibleForFree": true,
        "description": "Interactive KSP Delta-V map and calculator for Kerbal Space Program. Plan rocket Delta-V for interplanetary missions across Kerbol and Outer Planets Mod.",
        "author": {
          "@type": "Person",
          "name": "Loïc Viennois",
          "url": "https://www.loicviennois.com/"
        }
      }
    </script>
    <script>
      // Apply the saved theme (dark by default) before first paint (see src/lib/theme.ts).
      (function () {
        var theme;
        try {
          theme = JSON.parse(localStorage.getItem('ksp_theme'));
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = 'dark';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>

  <body>
    <div id="root"></div>
    <noscript
      >KSP Delta-V Planner is an interactive Delta-V map and calculator for
      Kerbal Space Program. Please enable JavaScript to continue using this
      application.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
