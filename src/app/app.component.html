<div class="row g-0">
  <div class="col col-8 d-none d-md-block">
    @defer (on viewport) {
      <ksp-map></ksp-map>
    } @placeholder {
      <div class="map-placeholder" aria-hidden="true"></div>
    }
  </div>
  <div class="col col-12 col-md-4">
    <div class="m-4">
      <ksp-panel></ksp-panel>
    </div>
  </div>
</div>
<div class="build-info">
  Build
  <a aria-label="commit"
     [title]="commitSha"
     [href]="commitUrl"
     target="_blank"
     rel="noopener">{{ shortSha }}</a>
</div>
<router-outlet></router-outlet>
