name: Build

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.2.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build:prod
