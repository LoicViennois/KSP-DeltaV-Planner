name: CI

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@26
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint application
        run: pnpm run lint

      - name: Validate Caddy configuration
        uses: docker://caddy:latest
        with:
          args: caddy validate --config /github/workspace/Caddyfile

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@26
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

  test-unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@26
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  test-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@26
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
